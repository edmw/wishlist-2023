{% load static %}
{% load i18n %}
{% load core %}

<div class="table-responsive">
    <table class="table wl-table wl-items">
        <colgroup>
            <col />
            <col />
            <col />
        </colgroup>
        <thead>
            <tr>
                <th>{% translate "User" %}</th>
                <th>{% translate "Role" %}</th>
                <th>{% translate "Added" %}</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            {% for membership in memberships %}
                <tr>
                    <td data-label="{% translate 'User' %}">{{ membership.user.username }}</td>
                    <td data-label="{% translate 'Role' %}">{{ membership.role }}</td>
                    <td data-label="{% translate 'Added' %}">{{ membership.created_at|date:"SHORT_DATETIME_FORMAT" }}</td>
                    <td class="wl-actions wl-actions-right" data-label=""></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
