{% load static %}
{% load i18n %}
{% load core %}

<header>
    <div id="banner" class="ps-2 bg-dark text-warning">
        <strong class="me-1 p-2 bg-warning text-dark">BETA</strong> This is a new service and currently running in test mode.
    </div>
    <div class="content text-light bg-dark">
        <nav class="nav">
            <a class="nav-link text-light" href="{% url 'start' %}">{% translate "Home" %}</a>
            {% if user.is_authenticated %}
                <a class="nav-link text-light" href="{{ user.get_absolute_url }}">{% translate "Profile" %}</a>
                <form action="{% url 'account_logout' %}" method="post">
                    {% csrf_token %}
                    <button class="nav-link btn btn-light text-nowrap ms-3" type="submit">{% translate "Sign out" %}</button>
                </form>
            {% else %}
                <a class="nav-link btn btn-light text-nowrap ms-3" href="{% url 'account_login' %}">{% translate "Sign in" %}</a>
            {% endif %}
        </nav>
        <div id="title">
            <h1>{% translate title %}</h1>
        </div>
    </div>
</header>
