name: Build, Check, Test

on:
  workflow_dispatch:
    branches: [ "main" ]

jobs:
  build-develop:
    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: 3.11

    - name: Prepare
      run: |
        python -m pip install --upgrade pip
        python -m pip install semver

    - run: make build-develop

    - name: Save Docker image
      run: |
        docker save wishlist-webapp-develop:local --output /tmp/workflow_wishlist-webapp-develop.tar  
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: workflow_wishlist-webapp-develop
        path: /tmp/workflow_wishlist-webapp-develop.tar
        retention-days: 1


  build-deploy:
    runs-on: ubuntu-latest
  
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v3
      with:
        python-version: 3.11

    - name: Install environment
      run: |
        python -m pip install --upgrade pip
        python -m pip install semver

    - run: make build-deploy


  make-check:
    runs-on: ubuntu-latest
    needs: build-develop

    steps:
    - uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: workflow_wishlist-webapp-develop
        path: /tmp
    - name: Load Docker image
      run: |
          docker load --input /tmp/workflow_wishlist-webapp-develop.tar

    - name: Prepare
      run: |
        mkdir .cache && chmod 777 .cache
    - run: make check-ci


  make-test:
    runs-on: ubuntu-latest
    needs: build-develop

    steps:
    - uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: workflow_wishlist-webapp-develop
        path: /tmp
    - name: Load Docker image
      run: |
          docker load --input /tmp/workflow_wishlist-webapp-develop.tar

    - run: make test-ci


  make-test-coverage:
    runs-on: ubuntu-latest
    needs: make-test

    steps:
    - uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v3
      with:
        name: workflow_wishlist-webapp-develop
        path: /tmp
    - name: Load Docker image
      run: |
          docker load --input /tmp/workflow_wishlist-webapp-develop.tar

    - name: Prepare
      run: |
        mkdir .cache && chmod 777 .cache reports/coverage/html
    - run: make test-coverage-ci
