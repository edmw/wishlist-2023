name: Cleanup

on:
  workflow_run:
    workflows: ["Build, Check, Test"]
    types:
      - completed

permissions:
  actions: write

jobs:
  cleanup-workflow-artifacts-query:
    runs-on: ubuntu-latest

    steps:
      - run: |  # query ids of all artifacts which names begin with "workflow_"
          artifacts="$(gh api -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" /repos/${{github.repository}}/actions/artifacts --jq '[.artifacts[]|select(.name|startswith("workflow_")).id]')"
          echo 'ARTIFACTS='$artifacts >> $GITHUB_ENV
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: set-artifacts-matrix
        run: echo "matrix=$ARTIFACTS" >> $GITHUB_OUTPUT
    outputs:  # output all ids found for use as matrix parameter
      matrix: ${{ steps.set-artifacts-matrix.outputs.matrix }}

  cleanup-workflow-artifacts:
    needs: cleanup-workflow-artifacts-query
    if: ${{ needs.cleanup-workflow-artifacts-query.outputs.matrix != '[]' && needs.cleanup-workflow-artifacts-query.outputs.matrix != '' }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        artifact_id: ${{ fromJson(needs.cleanup-workflow-artifacts-query.outputs.matrix) }}

    steps:
      - run: echo "artifact id is ${{ matrix.artifact }}"
      - run: |  # delete artifact with the id specified in the strategy
          gh api --method DELETE -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "/repos/${{github.repository}}/actions/artifacts/${{ matrix.artifact_id }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
