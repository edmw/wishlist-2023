---
services:

  web:
    # Container for the loadbalancer which dispatches requests to the
    # webapp and the files server.
    image: nginx
    container_name: wishlist-web
    environment:
      - NGINX_ENTRYPOINT_QUIET_LOGS=1
    volumes:
      - ./environments/local/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 127.0.0.1:13131:80
    networks:
      - wishlist-webapp
    depends_on:
      - app
      - files
    restart: on-failure


  # Containers for Django.

  app:
    # Container for the webapp.
    container_name: wishlist-webapp
    image: wishlist-webapp-develop:local
    entrypoint: python manage.py webapp_run
    environment:
      - DJANGO_DEBUG
      - WEBAPP_KEY
      - HTTP_PROXY=${HTTP_PROXY-}
      - HTTPS_PROXY=${HTTPS_PROXY-}
    env_file:
      - environments/local/webapp.env
      - environments/local/secrets/webapp.env
    volumes:
      - .:/webapp
    networks:
      - wishlist-webapp
    depends_on:
      database:
        condition: service_started
      datastore:
        condition: service_started
      files-init:
        condition: service_completed_successfully
    restart: on-failure:2

  # Containers for Django Celery.
  # Celery is a distributed task queue with support for task scheduling.

  worker:
    # Container for a celery worker, performs all the hard work in the
    # background. Locally, just one worker, in real life there can be many.
    image: wishlist-webapp-develop:local
    container_name: wishlist-worker
    entrypoint: >-
      python -W ignore::DeprecationWarning manage.py
        celery_run_worker --log-level=INFO
    environment:
      - WEBAPP_KEY
      - HTTP_PROXY=${HTTP_PROXY-}
      - HTTPS_PROXY=${HTTPS_PROXY-}
    env_file:
      - environments/local/webapp.env
      - environments/local/secrets/webapp.env
    volumes:
      - .:/webapp
    networks:
      - wishlist-webapp
    depends_on:
      - app
      - database
      - datastore
    restart: on-failure:2

  beat:
    # Container for a celery component which controls all the celery workers.
    # Just one is needed.
    image: wishlist-webapp-develop:local
    container_name: wishlist-beat
    entrypoint: >-
      python -W ignore::DeprecationWarning manage.py
        celery_run_beat --log-level=INFO
    environment:
      - WEBAPP_KEY
      - HTTP_PROXY=${HTTP_PROXY-}
      - HTTPS_PROXY=${HTTPS_PROXY-}
    env_file:
      - environments/local/webapp.env
      - environments/local/secrets/webapp.env
    volumes:
      - .:/webapp
    networks:
      - wishlist-webapp
    depends_on:
      - app
      - database
      - datastore
    restart: on-failure:2

  # Containers for persistence

  database:
    # Container for the database (see common/docker-compose.database.yml).
    container_name: wishlist-database
    env_file:
      - environments/local/postgres.env
    volumes:
      - ./environments/local/postgres.conf:/etc/postgresql/postgresql.conf
      - data:/var/lib/postgresql/data
    networks:
      - wishlist-webapp

  datastore:
    # Container for the datastore (see common/docker-compose.datastore.yml).
    container_name: wishlist-datastore
    env_file:
      - environments/local/redis.env
    networks:
      - wishlist-webapp

  # Containers for files (see common/docker-compose.files.yml).

  files:
    container_name: wishlist-files
    command:
      [
        "mini",
        "-ip=files",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.conf",
        "-bucket=wishlist",
        "-dir=/data",
      ]
    env_file:
      - environments/local/seaweedfs.env
    volumes:
      - ./webapp-files:/data
      - ./environments/local/seaweedfs.conf:/etc/seaweedfs/s3.conf:ro
    ports:
      - 127.0.0.1:13138:8333
      - 127.0.0.1:13139:9333
    networks:
      - wishlist-webapp

  files-init:
    # Apply public-read policy so browser media URLs are accessible.
    container_name: wishlist-files-init
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_KEY" \
          aws --endpoint-url "http://files:8333" s3api list-buckets >/dev/null 2>&1; do
          sleep 1
        done

        AWS_ACCESS_KEY_ID="$$SEAWEEDFS_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$$SEAWEEDFS_SECRET_KEY" \
          aws --endpoint-url "http://files:8333" s3api put-bucket-policy \
            --bucket "$$STORAGE_BUCKET_FILES" \
            --policy "{\"Version\":\"2012-10-17\",\"Statement\":[{\"Sid\":\"PublicReadGetObject\",\"Effect\":\"Allow\",\"Principal\":\"*\",\"Action\":\"s3:GetObject\",\"Resource\":\"arn:aws:s3:::$$STORAGE_BUCKET_FILES/*\"}]}"
    env_file:
      - environments/local/seaweedfs.env
      - environments/local/webapp.env
    networks:
      - wishlist-webapp
    depends_on:
      - files
    restart: "no"

volumes:
  data:
    driver: local

networks:
  wishlist-webapp:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
