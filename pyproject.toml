[project]
authors = [
  {email = "mib@yamanote.de"},
  {name = "Michael Baumgärtner"},
]
description = "Wishlist"
license = {file = "LICENSE"}
name = "wishlist"
requires-python = ">=3.14"
version = "0.0.0"

dependencies = [
  "django == 6.0.*",
  "django-allauth[socialaccount] == 65.18.*",
  "django-cleanup == 9.0.*",
  "django-probes == 1.8.*",
  "django-storages == 1.14.*",
  "django_celery_beat == 2.9.*",
  "django_celery_results == 2.6.*",
  "django-debug-toolbar == 7.0.*",
  "djangorestframework == 3.16.*",
  "djangorestframework-dataclasses == 1.4.*",
  "drf-spectacular == 0.30.*",
  "markdown-it-py[linkify] == 4.2.*",
  "beautifulsoup4 == 4.15.*",
  "humanize == 4.16.*",
  "requests == 2.34.*",
  "boto3 == 1.43.*",
  "pillow == 12.3.*",
  "pyyaml == 6.0.*",
  "celery[redis] == 5.6.*",
  "redis[hiredis] == 6.4.*",
  "psycopg[binary,pool] == 3.3.*",
  "mysql-connector-python == 9.7.*",
  "python-json-logger == 4.0.*",
  "structlog == 26.1.*",
  "environs == 15.0.*",
  "whitenoise == 6.12.*",
  "gunicorn == 26.0.*",
  "cryptography == 49.0.*",
]

[project.optional-dependencies]
build = [
  "pip-tools",
  "semver",
  "invoke",
  "keyring",
  "SecretStorage",
]
check = [
  "ruff",
  "bandit[toml]",
  "django-stubs == 6.0.7",
  "djangorestframework-stubs == 3.16.9",
  "celery-types",
  "types-requests",
  "codespell",
]
support = [
  "debugpy",
  "polib",
  "rich",
]
test = [
  "pytest",
  "pytest-mock",
  "pytest-django",
  "pytest-cov",
  "freezegun",
  "coverage[toml]",
]
tool = [
  "black",
  "isort",
]

[deployment]
base_image = "python:3.14-slim-bookworm"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.black]
line-length = 108

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
addopts = "-ra --no-header --strict-markers --disable-pytest-warnings --ds=webapp.settings"
cache_dir = ".cache/pytest"
norecursedirs = ".git .vscode .cache"
python_classes = ["Test"]
python_files = ["tests.py", "test_*.py"]
python_functions = ["test"]
testpaths = "webapp core core_health"

[tool.ruff]
cache-dir = ".cache/ruff"
exclude = [
  ".venv",
]
line-length = 108

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
fixable = []
ignore = ["ANN401", "D205", "D400", "D401"]
select = [
  "F", # pyflakes
  "E", # pycodestyle
  "W", # pycodestyle
  "N", # naming
  "C", # mccabe
  "I", # isort
  "B", # bugbear
  "Q", # quotes
  "ANN", # annotations
  "DJ", # django
  "PT", # pytest
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["D"]
"**/tests.py" = ["D"]
"**/tests/**.py" = ["D"]
"__init__.py" = ["F401"]
"apps.py" = ["F401"]
"core/migrations/*" = ["E501"]
"core/templates_tags/*" = ["PT"]
"tasks/*" = ["PT"]
"webapp/services/*" = ["PT"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true
mypy-init-return = true

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pyright]
exclude = [
  "core/migrations/*",
  "**/.*",
  ".git/**",
  ".venv/**",
  "**/node_modules",
  "**/__pycache__",
]
ignore = ["~/.pyenv/**", ".pyenv/**", ".python-typings"]
pythonVersion = "3.14"
stubPath = ".python-typings"
typeCheckingMode = "standard"

[tool.bandit]
exclude_dirs = [".venv", "./.python-typings"]
skips = ["B404"]

[tool.bandit.assert_used]
skips = ["**/tests.py", "**/test_*.py", "**/tests/**.py"]

[tool.coverage.run]
branch = true
data_file = ".cache/coverage"

[tool.coverage.report]
precision = 2
skip_covered = true
skip_empty = true

[tool.coverage.html]
directory = "reports/coverage/html"
show_contexts = true
skip_covered = false

[tool.djlint]
blank_line_after_tag = "load,extends"
ignore = "T002"
max_attribute_length = 999
max_line_length = 999

[tool.codespell]
ignore-words-list = "discreet"
skip = "*.po,*.sql,.git,./core/views/privacy_policy.de.html,./core/views/legal_notice.de.html"
